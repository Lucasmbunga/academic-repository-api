spring.application.name=academicrepository
spring.datasource.url=jdbc:mysql://localhost:3306/academic_repository
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddt-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=true
api.security.token.secret={JWT_TOKEN:my-secret-key}

cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID}
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_URL}
cloudflare.r2.endpoint=https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com

